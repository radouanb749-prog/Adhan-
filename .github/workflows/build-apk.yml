name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: |
          ls -la
          ZIP=$(ls *.zip | head -n 1)
          echo "ZIP=$ZIP"
          rm -rf extracted
          mkdir -p extracted
          unzip -q "$ZIP" -d extracted
          ls -la extracted
          PROJ=$(dirname $(find extracted -name "package.json" | head -n 1))
          echo "PROJ=$PROJ"
          cp -a "$PROJ"/. .
          ls -la
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Build APK
        run: |
          npm install || true
          npx cap add android || true
          npx cap sync android || true
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: salatmaroc-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
